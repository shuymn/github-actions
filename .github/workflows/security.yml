name: Security checks

on:
  workflow_call:

jobs:
  betterleaks:
    permissions:
      contents: read
    runs-on: ubuntu-slim
    timeout-minutes: 5
    env:
      BETTERLEAKS_VERSION: v1.10.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache
        with:
          path: /usr/local/bin/betterleaks
          key: betterleaks-${{ env.BETTERLEAKS_VERSION }}-${{ runner.os }}-${{ runner.arch }}

      - name: Install betterleaks
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RUNNER_ARCH: ${{ runner.arch }}
        run: |
          tmpdir=$(mktemp -d)
          trap 'rm -rf "${tmpdir}"' EXIT
          arch=$(printf '%s' "${RUNNER_ARCH}" | tr '[:upper:]' '[:lower:]')
          asset="betterleaks_${BETTERLEAKS_VERSION#v}_linux_${arch}.tar.gz"

          gh release download "${BETTERLEAKS_VERSION:?}" \
            -R betterleaks/betterleaks \
            -p "${asset}" \
            -D "${tmpdir}"
          tar xzf "${tmpdir}/${asset}" -C "${tmpdir}" betterleaks
          cp "${tmpdir}/betterleaks" /usr/local/bin/betterleaks
        shell: bash

      # Since v1.10.0, betterleaks reads the repository's .betterleaks.toml only when told to.
      - name: Run betterleaks
        run: |
          args=(--redact --no-banner --verbose --validation=false --platform github)
          if [[ -f .betterleaks.toml ]]; then
            args+=(--config .betterleaks.toml)
          fi
          betterleaks git "${args[@]}"
        shell: bash
